# Laptop profile + hostable measurement for one challenge (PLAN.md §3).
# Manual only: macOS minutes bill at a multiple, so this never runs per PR.
name: Preflight

on:
  workflow_dispatch:
    inputs:
      slug:
        description: challenges/<slug>
        required: true

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        # Laptop-class proxies: Apple Silicon (arm64) and x86 Linux 2 vCPU / 8 GB.
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - name: cb preflight
        run: ./target/release/cb preflight "$SLUG" --out preflight-out
        env:
          SLUG: ${{ inputs.slug }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preflight-${{ inputs.slug }}-${{ matrix.runner }}
          path: preflight-out/
