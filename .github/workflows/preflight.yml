# Laptop profile + hostable measurement for one challenge (PLAN.md §3).
# Manual only: macOS minutes bill at a multiple, so this never runs per PR.
name: Preflight

on:
  workflow_dispatch:
    inputs:
      slug:
        description: challenges/<slug>
        required: true
      upstream_tests:
        description: "ledger-cbor: also build and run upstream's test suites on the baseline (#53)"
        type: boolean
        default: false
      skip_preflight:
        description: "skip cb preflight (to iterate on the upstream-tests step)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        # Laptop-class proxies: Apple Silicon (arm64) and x86 Linux 2 vCPU / 8 GB.
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    # Haskell challenges warm a cold cardano-ledger build first (over an hour).
    timeout-minutes: 330
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: valgrind (Rust kit scoring)
        if: runner.os == 'Linux'
        # update + retry + resolver fallback: Canonical's DNS stalls took CI, Warm and Preflight down
        run: .github/scripts/apt-install.sh valgrind
      - run: cargo build --locked --release

      # Haskell challenges only (Linux; macOS reports "no" at setup).
      - id: hs
        if: runner.os == 'Linux'
        uses: ./.github/actions/haskell
        with:
          slug: ${{ inputs.slug }}
      - name: Warm setup (outside cb's 60-min per-command limit)
        if: steps.hs.outputs.haskell == 'true'
        run: |
          start=$(date +%s)
          "challenges/$SLUG/setup.sh"
          echo "warm setup: $(( ($(date +%s) - start) / 60 )) min" | tee warm-setup.txt
          df -h /
          # cb preflight runs unsandboxed; scoring runs under env -i as nobody.
          # Check the judge binary still loads its libs with a cleared env.
          # (Copied to /tmp: nobody can't traverse the runner's home.)
          cp "challenges/$SLUG/.bin/reference" /tmp/ref-check && chmod a+rx /tmp/ref-check
          sudo -u nobody env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp /tmp/ref-check digest /dev/null
          echo "reference loads in a cleared env as nobody"
      - name: Save cabal store (trusted manual run, judge code only so far)
        if: steps.hs.outputs.haskell == 'true' && steps.hs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.hs.outputs.cabal-store }}
          key: ${{ steps.hs.outputs.cache-key }}
      # Same as warm.yml: build the committed baseline (judge code, equal to
      # candidate/ on a trusted run) and save the prebuilt reference + warm
      # dist-cand, before cb preflight builds any broken variant into it. The
      # cache is branch-scoped, so this speeds up reruns on the same branch;
      # runs on any branch restore the one warm.yml saves on main.
      - name: Warm baseline build (ledger cache miss only)
        if: steps.hs.outputs.haskell == 'true' && steps.hs.outputs.ledger-hit != 'true'
        run: |
          cd "challenges/$SLUG"
          diff -rq baseline candidate
          start=$(date +%s)
          ./build.sh
          echo "warm baseline build: $(( ($(date +%s) - start) / 60 )) min" | tee -a ../../warm-setup.txt
          du -sh ~/.cache/cb-"$SLUG"
      - name: Save the prebuilt reference and warm baseline build
        if: steps.hs.outputs.haskell == 'true' && steps.hs.outputs.ledger-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cb-${{ inputs.slug }}
          key: ${{ steps.hs.outputs.ledger-key }}

      - name: cb preflight
        # The Linux runner is the gate. macOS is a laptop-class report
        # (e.g. callgrind scoring is "no" there by design), so it never fails the run.
        if: ${{ !inputs.skip_preflight }}
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: ./target/release/cb preflight "$SLUG" --out preflight-out
      - name: upstream test suites on the baseline, built as a promotion builds them (#53)
        # Through cb score's build sandbox (no network), as Promote does. Run
        # unsandboxed, this step passed its build while both sandboxed baseline
        # runs were rejected (43060093096, 43064726976: cabal re-synced the
        # test project's source-repository-packages with no network).
        if: inputs.upstream_tests && runner.os == 'Linux'
        shell: bash
        run: |
          start=$(date +%s)
          CB_UPSTREAM_TESTS=1 ./target/release/cb score "$SLUG" --baseline --sandbox --out upstream-score.json || true
          jq '{status, reason, value, sandboxed}' upstream-score.json
          echo "upstream tests: $(( ($(date +%s) - start) / 60 )) min" | tee upstream-tests.txt
          [ "$(jq -r .status upstream-score.json)" = valid ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preflight-${{ inputs.slug }}-${{ matrix.runner }}
          path: |
            preflight-out/
            warm-setup.txt
            upstream-tests.txt
            upstream-score.json
