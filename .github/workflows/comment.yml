# Posts the PR score and records the PR-stage attempt (the denominator:
# rejected and slower attempts are kept). Runs from main on workflow_run,
# so it never executes submission code; artifacts are untrusted data, parsed
# and neutralised by cb. The PR number comes from the event, not an artifact.
name: Comment

on:
  workflow_run:
    workflows: [Submission]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# Per PR, not shared with Promote: a group holds one running and one pending
# run, so a shared group cancelled every queued Comment but the newest while a
# Promote held it (an hour or more). Appends from concurrent runs merge
# (.gitattributes union), so only one PR's comments need ordering.
concurrency:
  group: comment-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request_target' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # By name into fixed paths: a lone artifact would otherwise be extracted
      # without its name directory. score is absent when the gate refused.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: gate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: score
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/score
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - name: Record the PR attempt and render the comment
        run: |
          gate=artifacts/gate/gate.json
          score=artifacts/score/score.json
          if [ ! -f "$gate" ]; then
            gate=gate-missing.json
            echo '{"ok": false, "errors": ["the gate job failed before deciding; see the Submission run"]}' > "$gate"
          fi
          args=(--gate "$gate")
          if [ "$(jq -r .ok "$gate")" = true ] && [ -f "$score" ]; then
            slug=$(jq -r .slug "$gate")
            ./target/release/cb record "$slug" --stage pr --run "$score" \
              --commit "$HEAD_SHA" --by "$ACTOR" --at "$(date -u +%FT%TZ)" > entry.json
            args+=(--score "$score" --entry entry.json)
            git config user.name "cb-bot"
            git config user.email "cb-bot@users.noreply.github.com"
            git add "challenges/$slug/results.jsonl"
            git commit -qm "results: PR #$PR attempt on $slug"
            # Only results.jsonl is committed (the Site workflow publishes the feeds), and
            # concurrent appends to it union-merge, so retries only lose push races. A
            # rebase that still conflicts is aborted, and nothing pushed fails the job.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 10 + 3)) # jitter: concurrent Comment runs push together
            done
          fi
          ./target/release/cb comment "${args[@]}" > body.md
          gh pr comment "$PR" --body-file body.md
          # The PR still gets its comment; the lost record fails the job.
          ${pushed:-true} || { echo "::error::the results commit was not pushed to main"; exit 1; }
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          GH_TOKEN: ${{ github.token }}
