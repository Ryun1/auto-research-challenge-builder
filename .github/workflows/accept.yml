# Acceptance of research challenges (spec §6). A research PR that measured
# valid is landed on main by Comment; this workflow then measures the landed
# submission twice, from main, in the sandbox, and records the verdict. If the
# accept stage rejects it, the follow-up commit removes the submission directory
# again, so main only holds submissions that were accepted. Dispatch with
# submission=baseline once at launch to record the baseline.
# Only this workflow decides the record (the PR measurement is a claim).
# Simple challenges are Promote's; a push that is not a research submission
# does nothing here.
name: Accept

on:
  push:
    branches: [main]
    paths: ["challenges/*/submissions/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: challenges/<slug>
        required: true
      submission:
        description: submission id under challenges/<slug>/submissions/ (baseline records the baseline)
        required: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.d.outputs.slug }}
      submission: ${{ steps.d.outputs.submission }}
      runner: ${{ steps.d.outputs.runner }}
      stage: ${{ steps.d.outputs.stage }}
      by: ${{ steps.d.outputs.by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - id: d
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            slug="$SLUG_IN"; submission="$SUB_IN"
            [[ "$slug" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::bad slug"; exit 1; }
            [[ "$submission" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::bad submission id"; exit 1; }
            [ -f "challenges/$slug/submissions/$submission/submission.toml" ] \
              || { echo "::error::no challenges/$slug/submissions/$submission/submission.toml"; exit 1; }
            grep -Eq '^type *= *"research"' "challenges/$slug/challenge.toml" \
              || { echo "::error::$slug is not a research challenge"; exit 1; }
            stage=$([ "$submission" = baseline ] && echo baseline || echo accept)
            by="$ACTOR"
          else
            # Only a push that adds one research submission is an attempt.
            set +e
            ./target/release/cb gate --base "$BEFORE" --head "$AFTER" --out /tmp/sub --json gate.json
            set -e
            cat gate.json
            if [ "$(jq -r .ok gate.json)" != true ] || [ "$(jq -r '.type // "simple"' gate.json)" != research ]; then
              echo "not a research submission"; exit 0
            fi
            slug=$(jq -r .slug gate.json); submission=$(jq -r .submission gate.json); stage=accept
            by=$(git log -1 --format='%(trailers:key=Submitted-by,valueonly)' "$AFTER" | tr -d '[:space:]')
            by=${by:-$ACTOR}
          fi
          runner=$(sed -n 's/^runner *= *"\([^"]*\)".*/\1/p' "challenges/$slug/challenge.toml")
          for k in slug submission runner stage by; do echo "$k=${!k}" >> "$GITHUB_OUTPUT"; done
        env:
          EVENT: ${{ github.event_name }}
          SLUG_IN: ${{ inputs.slug }}
          SUB_IN: ${{ inputs.submission }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}

  run:
    needs: detect
    if: needs.detect.outputs.slug != ''
    strategy:
      matrix:
        n: [1, 2]
    runs-on: ${{ needs.detect.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release
      # An infra_failed run is measured once more from scratch: the
      # infrastructure failing once shouldn't reject a submission (as Promote).
      # Only infra_failed is retried; a rejection or a second infra_failed stands.
      - run: |
          ./target/release/cb measure "$SLUG" --id "$SUB" --sandbox --out measure.json
          if [ "$(jq -r .status measure.json)" = infra_failed ]; then
            echo "::warning::infra_failed ($(jq -r .reason measure.json)); measuring once more"
            mv measure.json measure-infra.json
            sudo rm -rf "${TMPDIR:-/tmp}"/cb-measure-*
            ./target/release/cb measure "$SLUG" --id "$SUB" --sandbox --out measure.json
          fi
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
          SUB: ${{ needs.detect.outputs.submission }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-${{ matrix.n }}
          path: measure.json

  # main's ruleset (#22) stops the workflow token pushing, so the results commit
  # goes out with the `results` environment's deploy key (see comment.yml).
  record:
    needs: [detect, run]
    runs-on: ubuntu-24.04
    environment: results
    timeout-minutes: 15
    # Per challenge: records and removals for one slug are ordered; they
    # union-merge, but a removal rebases onto the previous record.
    concurrency:
      group: accept-record-${{ needs.detect.outputs.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RESULTS_DEPLOY_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measure-*
          path: measures
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - name: Decide, record, remove if rejected
        run: |
          ./target/release/cb record "$SLUG" --stage "$STAGE" --run measures/measure-1/measure.json --run measures/measure-2/measure.json \
            --commit "$SHA" --by "$BY" --at "$(date -u +%FT%TZ)" > decision.json
          cat decision.json
          status=$(jq -r .entry.status decision.json)
          git config user.name "cb-bot"
          git config user.email "cb-bot@users.noreply.github.com"
          git add "challenges/$SLUG/results.jsonl"
          msg="results: $SLUG $SUB $STAGE $status (${SHA::7})"
          if [ "$STAGE" = accept ] && [ "$status" = rejected ]; then
            git rm -rq "challenges/$SLUG/submissions/$SUB"
            msg="$msg; removed submissions/$SUB"
          fi
          # [skip actions]: a deploy-key push would otherwise start CI, Site and this
          # workflow again (a removal changes submissions/).
          git commit -qam "$msg [skip actions]"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3)) # jitter: Comment runs push concurrently
          done
          $pushed || { echo "::error::the results commit was not pushed to main"; exit 1; }
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
          SUB: ${{ needs.detect.outputs.submission }}
          STAGE: ${{ needs.detect.outputs.stage }}
          BY: ${{ needs.detect.outputs.by }}
          SHA: ${{ github.sha }}
