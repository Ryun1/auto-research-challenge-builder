name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: sudo apt-get install -y -qq valgrind # Rust kit scoring (callgrind)
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path kits/rust/Cargo.toml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          CB_REQUIRE_VALGRIND: '1'
      - run: cargo test --locked --release --manifest-path kits/rust/Cargo.toml
