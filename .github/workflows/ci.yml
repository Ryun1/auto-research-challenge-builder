name: CI

on:
  pull_request:
    # A PR that changes only candidate files gets no CI run: CI tests nothing of
    # a submission (Submission scores it) and every run is billed. main's ruleset
    # has no required status checks; if CI ever becomes one, drop this filter,
    # or candidate-only PRs can never merge. Research submissions
    # (challenges/*/submissions/**) are the same: Submission measures them.
    # Pushes to main skip them and the results file for the same reason.
    paths-ignore: ["challenges/*/candidate/**", "challenges/*/submissions/**"]
  push:
    branches: [main]
    paths-ignore: ["challenges/*/submissions/**", "challenges/*/results.jsonl"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - name: valgrind (Rust kit scoring, callgrind)
        # update + retry + resolver fallback: Canonical's DNS stalls took CI, Warm and Preflight down
        run: .github/scripts/apt-install.sh valgrind
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path kits/rust/Cargo.toml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          CB_REQUIRE_VALGRIND: '1'
          CB_REQUIRE_SANDBOX: '1'
      - run: cargo test --locked --release --manifest-path kits/rust/Cargo.toml
      - name: wallet-multiasset model tests (CBOR, byte model, mainnet fixtures, simulator)
        # Fast Python tests only (test_judge takes about 40 s). The mainnet fixture
        # check is this contract's admission bar.
        working-directory: challenges/coin-select/contracts/wallet-multiasset
        run: python3 -m unittest test_cbor test_model test_fixtures test_sim
      - name: cb preflight every challenge
        run: |
          cargo build --locked --release
          for d in challenges/*/; do
            # Cabal-harness challenges (e.g. ledger-cbor) need the Haskell toolchain
            # and a ~36 min cold build: the manual Preflight workflow covers them.
            if compgen -G "$d/harness/*.cabal" > /dev/null; then
              echo "skip $(basename "$d"): Haskell challenge, run the Preflight workflow"; continue
            fi
            ./target/release/cb preflight "$(basename "$d")"
          done
