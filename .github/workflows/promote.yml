# Promotion (PLAN.md §4): after a merge, two independent clean runs on main
# with fresh seeds. Only this workflow decides the record. A merged attempt
# that isn't promoted is reverted, so main's candidate always equals the
# record. Dispatch with baseline=true once at launch to record the baseline.
name: Promote

on:
  push:
    branches: [main]
    paths: ["challenges/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: challenges/<slug>
        required: true
      baseline:
        description: record the baseline (once, at launch)
        type: boolean
        default: true

permissions:
  contents: read

# Promotions are serialised: each decides against the record the previous one
# left (a stale pairing is infra_failed). The group holds one pending run, so
# a third merge while one promotes cancels the second: merge one at a time.
# Comment has its own groups; its appends union-merge with this one's.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.d.outputs.slug }}
      runner: ${{ steps.d.outputs.runner }}
      kit: ${{ steps.d.outputs.kit }}
      stage: ${{ steps.d.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - id: d
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            slug="$SLUG_IN"; stage=$([ "$BASELINE_IN" = true ] && echo baseline || echo promotion)
            runner=$(sed -n 's/^runner *= *"\([^"]*\)".*/\1/p' "challenges/$slug/challenge.toml")
            kit=$(sed -n 's/^kit *= *"\([^"]*\)".*/\1/p' "challenges/$slug/challenge.toml")
          else
            # Only a push that changes one challenge's editable files (a merged
            # submission) is an attempt; judge changes by maintainers are not.
            set +e
            ./target/release/cb gate --base "$BEFORE" --head "$AFTER" --out /tmp/sub --json gate.json
            set -e
            cat gate.json
            [ "$(jq -r .ok gate.json)" = true ] || { echo "not a submission; nothing to promote"; exit 0; }
            slug=$(jq -r .slug gate.json); runner=$(jq -r .runner gate.json); kit=$(jq -r '.kit // empty' gate.json); stage=promotion
          fi
          for k in slug runner kit stage; do echo "$k=${!k}" >> "$GITHUB_OUTPUT"; done
        env:
          EVENT: ${{ github.event_name }}
          SLUG_IN: ${{ inputs.slug }}
          BASELINE_IN: ${{ inputs.baseline }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

  run:
    needs: detect
    if: needs.detect.outputs.slug != ''
    strategy:
      matrix:
        n: [1, 2]
    runs-on: ${{ needs.detect.outputs.runner }}
    # Haskell challenges rebuild the ledger packages against the candidate,
    # and promotion builds the record's tree too.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --against-record extracts the record commit's editable tree
          persist-credentials: false
      - run: rustup toolchain install
      - name: valgrind
        if: needs.detect.outputs.kit == 'rust'
        # update + retry + resolver fallback: Canonical's DNS stalls took CI, Warm and Preflight down
        run: .github/scripts/apt-install.sh valgrind
      - uses: ./.github/actions/haskell
        with:
          slug: ${{ needs.detect.outputs.slug }}
      - run: cargo build --locked --release
      # Promotion scores the record's tree too, on the same fresh pool and
      # seed, and record decides on candidate/record (#57): pool-to-pool
      # variance cancels. Each of the two runs still fetches its own pool.
      # An infra_failed run is scored once more from scratch (new pool, new
      # seed): the infrastructure failing once shouldn't revert a merge
      # (Promote 43471245947). Only infra_failed is retried; a rejection or
      # a second infra_failed stands.
      - run: |
          case "$STAGE" in
            baseline) mode=--baseline ;;
            *) mode=--against-record ;;
          esac
          ./target/release/cb score "$SLUG" $mode --sandbox --out score.json
          if [ "$(jq -r .status score.json)" = infra_failed ]; then
            echo "::warning::infra_failed ($(jq -r .reason score.json)); scoring once more"
            mv score.json score-infra.json
            # An early infra_failed leaves its workspaces (two built trees) behind.
            sudo rm -rf "${TMPDIR:-/tmp}"/cb-score-*
            ./target/release/cb score "$SLUG" $mode --sandbox --out score.json
          fi
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
          STAGE: ${{ needs.detect.outputs.stage }}
          CB_POOL: fresh
          # ledger-cbor: upstream's test suites gate a promotion (#53). Not the
          # baseline: it is the pinned upstream tree, nothing is promoted, and
          # Preflight runs the suites on it (upstream_tests input).
          CB_UPSTREAM_TESTS: ${{ needs.detect.outputs.stage == 'promotion' && '1' || '0' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: score-${{ matrix.n }}
          path: score.json

  # main's ruleset (#22) stops the workflow token pushing, so the results commit
  # goes out with the `results` environment's deploy key (see comment.yml).
  record:
    needs: [detect, run]
    runs-on: ubuntu-24.04
    environment: results
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RESULTS_DEPLOY_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: score-*
          path: scores
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - name: Decide, record, revert if not promoted
        run: |
          ./target/release/cb record "$SLUG" --stage "$STAGE" --run scores/score-1/score.json --run scores/score-2/score.json \
            --commit "$SHA" --by "$BY" --at "$(date -u +%FT%TZ)" > decision.json
          cat decision.json
          status=$(jq -r .entry.status decision.json)
          git config user.name "cb-bot"
          git config user.email "cb-bot@users.noreply.github.com"
          git add "challenges/$SLUG/results.jsonl"
          msg="results: $SLUG $STAGE $status (${SHA::7})"
          if [ "$STAGE" = promotion ] && [ "$status" != promoted ]; then
            rc=$(jq -r .record_commit decision.json)
            for e in $(jq -r '.editable[]' decision.json); do
              git rm -rq "challenges/$SLUG/$e" && git checkout "$rc" -- "challenges/$SLUG/$e"
            done
            msg="$msg; revert editable to record ${rc::7}"
          fi
          # [skip actions]: a deploy-key push would otherwise start CI, Site and this
          # workflow again (a revert changes candidate/).
          git commit -qam "$msg [skip actions]"
          # Only results.jsonl (union-merged) and, on a revert, the candidate are
          # committed; the Site workflow publishes the feeds. A rebase that still
          # conflicts (a merge touched the reverted files) is aborted, and nothing
          # pushed fails the job (Promote 43060093096 ended green with nothing recorded).
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3)) # jitter: Comment runs push concurrently
          done
          $pushed || { echo "::error::the results commit was not pushed to main"; exit 1; }
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
          STAGE: ${{ needs.detect.outputs.stage }}
          SHA: ${{ github.sha }}
          BY: ${{ github.event.head_commit.author.username || github.actor }}
