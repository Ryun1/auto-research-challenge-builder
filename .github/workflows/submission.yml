# PR scoring (PLAN.md §4, #12). The judge always comes from main:
# pull_request_target runs THIS file from the base branch, never the PR's copy.
# Submission bytes are data: the gate never runs them, the score job
# compiles them offline and runs verify/score (simple challenges) or
# measure (research challenges, gate type "research") as nobody with no network.
# No secrets, read-only token. The score it uploads is a claim; comment.yml
# posts it, and only promote.yml (on main) decides the record.
#
# Only PRs into main: the jobs check out pull_request.base.sha and build cb
# from it, so a PR into a collaborator's own branch would run that branch's
# code as the judge (#22; scripts/malicious-prs.sh non-main-base).
name: Submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main] # the PR's base branch

permissions:
  contents: read

env:
  DAILY_CAP: 10 # Submission runs per actor per rolling 24 hours (.github/scripts/daily-cap.sh)

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.base.ref == 'main' # as the trigger (ignores case: see the first step)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions: read is for the daily cap's run count. This job never runs
    # submission code; score keeps the workflow default (contents: read).
    permissions:
      contents: read
      actions: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      slug: ${{ steps.gate.outputs.slug }}
      runner: ${{ steps.gate.outputs.runner }}
      kit: ${{ steps.gate.outputs.kit }}
      type: ${{ steps.gate.outputs.type }}
    steps:
      # Expressions compare strings ignoring case, so the job condition would
      # also accept a branch called Main. bash does not.
      - name: Base branch is main, exactly
        run: test "$BASE_REF" = main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head as objects only (never checked out)
        run: |
          # Read-only token, for this fetch only (private repo). This job never
          # runs submission code.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags "https://github.com/${{ github.repository }}" \
            "+refs/pull/${PR}/head:refs/cb/head" "+refs/heads/main:refs/cb/main"
          test "$(git rev-parse refs/cb/head)" = "$HEAD_SHA"
          # The checkout above is the judge for both jobs (score runs only if
          # this job passes): it must be a commit of main, whatever the event
          # says the base is. Nothing from the checkout has run yet.
          git merge-base --is-ancestor "$BASE_SHA" refs/cb/main \
            || { echo "::error::the PR's base commit $BASE_SHA is not on main"; exit 1; }
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
      # Over the cap, this writes gate.json as a refusal: the steps below are
      # skipped, the outputs stay empty (no score job) and Comment posts it.
      # The repo owner pays for the runs and is exempt: skipped, capped is
      # empty, which the steps below read as not capped.
      - id: cap
        name: Daily cap per actor (every run is billed)
        if: github.actor != github.repository_owner
        run: .github/scripts/daily-cap.sh >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          CAP: ${{ env.DAILY_CAP }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.cap.outputs.capped != 'true'
        run: rustup toolchain install
      - if: steps.cap.outputs.capped != 'true'
        run: cargo build --locked --release
      - id: gate
        if: steps.cap.outputs.capped != 'true'
        run: |
          set +e
          ./target/release/cb gate --base "$BASE_SHA" --head "$HEAD_SHA" --out submission --json gate.json
          set -e
          for k in ok slug runner kit type; do echo "$k=$(jq -r ".$k // empty" gate.json)" >> "$GITHUB_OUTPUT"; done
          # Artifacts drop file modes; a research submission's build.sh needs its
          # exec bit, so the export also travels as a tarball (modes kept).
          [ ! -d submission ] || tar -cf submission.tar submission
          cat gate.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate
          path: |
            gate.json
            submission/
            submission.tar
          if-no-files-found: error

  score:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ${{ needs.gate.outputs.runner }}
    # Haskell challenges rebuild the ledger packages against the submission.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate
          path: gate
      - run: rustup toolchain install
      - name: valgrind
        if: needs.gate.outputs.kit == 'rust'
        # update + retry + resolver fallback: Canonical's DNS stalls took CI, Warm and Preflight down
        run: .github/scripts/apt-install.sh valgrind
      # From the base checkout, so trusted. Restores the cabal store, never saves
      # it: this job compiles submission code.
      - uses: ./.github/actions/haskell
        with:
          slug: ${{ needs.gate.outputs.slug }}
      - run: cargo build --locked --release
      - name: Build, then verify + score sandboxed
        run: |
          if [ "$TYPE" = research ]; then
            # From the tarball: the artifact's submission/ lost its exec bits.
            mkdir export && tar -xf gate/submission.tar --no-same-owner -C export
            ./target/release/cb measure "$SLUG" --submission export/submission --sandbox --out score.json
          else
            ./target/release/cb score "$SLUG" --submission gate/submission --sandbox --out score.json
          fi
        env:
          SLUG: ${{ needs.gate.outputs.slug }}
          TYPE: ${{ needs.gate.outputs.type }}
          CB_POOL: fresh # challenges that support it score on inputs that aren't in the repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: score
          path: score.json
