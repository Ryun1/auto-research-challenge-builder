[challenge]
slug      = "pedersen"
family    = "perf"
direction = "maximise"
status    = "draft"          # draft | open | closed
kit = "rust"
runner    = "ubuntu-24.04"   # pinned image

[paths]
editable  = ["candidate/src"]   # everything else is refused
max_bytes = 1048576  # bounds precomputed tables (baseline ~432 KB)

[commands]
setup  = "./setup.sh"
build  = "./build.sh"     # the only step that treats submission bytes as code
verify = "./verifier/run"  # exit 0 + JSON {ok, detail}
score  = "./bench/run"     # JSON {metrics: {...}}

[objective]
expr                 = "speedup"
min_improvement_bips = 100  # 1% fewer instructions; count is deterministic, so noise is not the limit

[perf]
blocks = 4             # mirrored BCCB/CBBC blocks
max_dispersion = 0.08  # rel-MAD cap per side (provably.fast v3)

[rust]
allow = []  # opt in: "unsafe", "asm", "target_feature" (and drop the forbid lint in candidate/Cargo.toml)

[inputs]
salted = true  # seed drawn by the harness after the build, recorded after
