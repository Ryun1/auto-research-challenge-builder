[package]
name = "candidate"
version = "0.0.0"
edition.workspace = true

# Not editable: participants change candidate/src only, so no new
# dependencies, build.rs or proc macros. The compiler enforces no unsafe,
# including unsafe generated by macros. A challenge that opts into unsafe
# drops this lint and lists "unsafe" under [rust] allow in challenge.toml.
[lints.rust]
unsafe_code = "forbid"
