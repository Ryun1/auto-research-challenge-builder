# Maintainers edit this file in their own PR, never in a submission PR.
# Adding axes or values keeps `version`. Renaming or removing one changes what
# earlier labels mean: copy this file to taxonomy-v<version>.toml first, then
# bump `version`. results.jsonl rows record the version they were labelled under
# (`taxonomy_version`); rows without it predate the field and mean version 1.
version = 1

[[axes]]
id         = "strategy"
definition = "How inputs are chosen for a payment"
values = [
  { id = "largest-first",   definition = "Sort by value, take the biggest UTxOs until the payment and fee are covered" },
  { id = "random-improve",  definition = "CIP-2 random-improve: pick UTxOs at random, then improve towards an ideal change size" },
  { id = "branch-and-bound", definition = "Depth-first search with pruning for a selection with no or minimal change" },
  { id = "knapsack",        definition = "Dynamic-programming or heuristic subset-sum over the UTxO values" },
  { id = "exhaustive",      definition = "Tries every subset (only practical for small wallets or with a cut-off)" },
  { id = "other",           definition = "Anything else; name it in the summary" },
]

[[axes]]
id         = "change"
definition = "What happens to the leftover value after paying"
values = [
  { id = "single",             definition = "One change output" },
  { id = "split",              definition = "Several change outputs, to keep the wallet granular" },
  { id = "payment-shaped",     definition = "Change sized like the payment, so it is hard to tell from it" },
  { id = "none-when-possible", definition = "Searches for an input set that needs no change, else falls back" },
]

[[axes]]
id         = "consolidation"
definition = "Whether the wallet merges small UTxOs while paying"
values = [
  { id = "none",          definition = "Never adds inputs only to merge dust" },
  { id = "opportunistic", definition = "Adds small inputs when they are cheap to carry" },
  { id = "threshold",     definition = "Consolidates once the wallet holds more than a chosen number of UTxOs" },
]

[[axes]]
id         = "language"
definition = "What the submission is written in"
values = [
  { id = "python", definition = "Python 3" },
  { id = "rust",   definition = "Rust" },
  { id = "c",      definition = "C or C++" },
  { id = "go",     definition = "Go" },
  { id = "other",  definition = "Anything else" },
]

[[rules]]
text   = "change = none-when-possible needs an exact-match search (branch-and-bound or exhaustive), not largest-first"
reason = "Largest-first stops at the first coins that cover the payment, so it seldom lands on an amount that needs no change; finding one means searching subsets"

[[rules]]
text   = "consolidation other than none costs extra inputs per transaction: expect it to trade fees now for dust later"
reason = "Each extra input adds 140 bytes to the transaction, 6,160 lovelace of fee at min_fee_a = 44"

[[rules]]
text   = "in wallet-multiasset@1 an extra input costs ~40 bytes plus 101 per new key, not 140"
reason = "The byte model encodes an input as 36 bytes (37 from index 24) and adds one 101-byte vkey witness per distinct key among the inputs, so consolidating inputs of keys already in the transaction is far cheaper than in wallet@1"
