# Why this challenge matters, shown on the public site (#101). Maintainer-owned;
# the site is public, so everything here is written to be published. Figures
# from results.jsonl are the accept-stage medians as of 2026-11-19.

one_line = "Choose which coins a Cardano wallet spends for each payment, and what change it keeps."

stakes = """Every Cardano wallet runs coin selection for every payment it makes. The choice sets the fee paid now and the shape of the wallet left behind. Among the goals of CIP-2, the Cardano standard for it: limit the dust that builds up in the UTxO set, and keep outputs that let future payments be made with few inputs. It also notes that putting all change into one output is widely considered bad for privacy. These pull against each other, so there is no single best answer, only trade-offs worth mapping."""

why_this_instance = """Each run replays 8 wallets through 300 events: deposits (some small and reward-like, 1 to 3 ADA) and about 210 payments of one to three outputs. Wallets start with 60 to 120 UTxOs. Fees use the mainnet fee parameters with a fixed transaction-size model. Every run draws fresh wallets from a new seed, so nothing can be tuned to the inputs. These results say nothing about wallets holding native tokens (wallet-multiasset@1 covers those), script outputs or exchange-sized UTxO sets."""

cautions = [
  "Transaction size comes from a fixed model (60 bytes, plus 140 per input and 65 per output), not real CBOR with witnesses and metadata, so fees are close to but not exactly what the ledger would charge.",
  "This contract is ADA only; native tokens, datums and a real byte model are in the separate contract wallet-multiasset@1, whose min-ada and size model is checked against mainnet transactions.",
  "Dust here means a UTxO under 2 ADA at the end of a run. The threshold is this challenge's choice, not a protocol constant.",
  "Latency is the judge's clock around each reply on a GitHub-hosted runner, including the pipe; differences below the axis tolerance are noise.",
  "Protocol parameters change through on-chain governance; these use the documented mainnet values.",
  "change-privacy is declared by submitters, never checked.",
]

sources = [
  "CIP-2, Coin Selection Algorithms for Cardano: https://cips.cardano.org/cip/CIP-0002",
  "Cardano protocol parameters reference guide (txFeePerByte 44, txFeeFixed 155381, utxoCostPerByte 4310, maxTxSize 16384): https://docs.cardano.org/about-cardano/explore-more/parameter-guide",
  "Accepted results: feeds/coin-select.json on this site",
]

[[flow]]
label  = "Funds arrive"
detail = "Payments to the wallet, and withdrawn staking rewards, become UTxOs, some of them small."

[[flow]]
label  = "The user asks to pay"
detail = "One payment can have several outputs."

[[flow]]
label          = "Coin selection"
detail         = "Choose the inputs, the change outputs and the fee. The choice decides the transaction's size, and so its fee, and which UTxOs the wallet keeps."
this_challenge = true

[[flow]]
label  = "Build, sign and submit"
detail = "The fee is 44 lovelace per byte plus 155,381 lovelace; each input adds about 140 bytes."

[[flow]]
label  = "Change returns to the wallet"
detail = "Change outputs become the UTxOs the next selection chooses from."

[calls]
value  = "Once per payment, in every wallet"
basis  = "A transaction cannot be built until its inputs are chosen, so selection runs every time a wallet pays."
source = "CIP-2 (coin selection is the step that chooses a transaction's inputs and change)"

[[value_levers]]
statement   = "random-improve leaves about 91% fewer dust UTxOs than largest-first (3.9 against 43.3 per wallet) for about 7% more fees (39.9 against 37.3 ADA over about 210 payments)."
quantity    = "−91% dust for +7% fees"
source      = "Accept-stage medians of baseline and random-improve (feeds/coin-select.json)"
is_estimate = false

[[value_levers]]
statement   = "Each extra input adds 140 bytes, 6,160 lovelace at 44 lovelace per byte: about 3.5% of the average fee per payment under largest-first (about 0.178 ADA)."
quantity    = "+1 input → +6,160 lovelace (≈ +3.5% of a fee)"
source      = "Fee formula with the mainnet parameters; average fee = 37.25 ADA / 209.7 payments, the mean payment count over 40 generated scenarios (our calculation)"
is_estimate = true

[[value_levers]]
statement   = "On fees alone, dust is cheap to clear: sweeping largest-first's 43 dust UTxOs in one 43-input transaction costs about 0.43 ADA, against the 2.6 ADA more that random-improve pays to avoid it. Dust matters for CIP-2's other goal, keeping UTxOs that let later payments use few inputs, more than for fees."
quantity    = "sweep 43 dust UTxOs ≈ 0.43 ADA"
source      = "Size model: 60 + 140 × 43 + 65 = 6,145 bytes; fee 155,381 + 44 × 6,145 = 425,761 lovelace (our calculation)"
is_estimate = true
