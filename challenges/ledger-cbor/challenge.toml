# Faster Conway CBOR decoding in cardano-ledger (IntersectMBO/cardano-ledger @ 7827506).
[challenge]
slug      = "ledger-cbor"
family    = "perf"
direction = "maximise"
status    = "open"           # draft | open | closed
runner    = "ubuntu-24.04"   # pinned image

[paths]
editable  = ["candidate/"]   # <package>/src for each package in packages.txt (binary, core, shelley..conway)
max_bytes = 4194304          # baseline 2,586,945 bytes (8 packages' src/)

[commands]
setup  = "./setup.sh"
build  = "./build.sh"     # the only step that treats submission bytes as code
verify = "./verifier/run"  # exit 0 + JSON {ok, detail}
score  = "./bench/run"     # JSON {metrics: {...}}

[objective]
expr                 = "speedup"
min_improvement_bips = 100  # 1% fewer instructions; spike run 42294073486 checks Ir determinism

[perf]
blocks = 4             # mirrored BCCB/CBBC blocks
max_dispersion = 0.08  # rel-MAD cap per side (provably.fast v3)

[haskell]
# cb gate: allowlist of pragmas, extensions and imports vs baseline/ (crates/cb/src/haskellpolicy.rs).
# Module roots under candidate/; same packages as packages.txt.
src = [
  "cardano-ledger-binary/src", "cardano-ledger-core/src", "cardano-ledger-shelley/src",
  "cardano-ledger-allegra/src", "cardano-ledger-mary/src", "cardano-ledger-alonzo/src",
  "cardano-ledger-babbage/src", "cardano-ledger-conway/src",
]

[build_sandbox]  # CI builds see a read-only $HOME, /opt, /usr/local and workspace except these (#51)
writable = ["~/.cache/cb-ledger-cbor", "~/.cabal", "~/.cache/cabal", "~/.local/state/cabal"]
outputs  = [".bin/candidate"]

[inputs]
salted = true  # seed drawn by the harness after the build, recorded after
