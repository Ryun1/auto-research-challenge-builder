editable = ["libs/cardano-ledger-binary/src/Cardano/Ledger/Binary/Decoding/", "eras/conway/impl/src/"]

[gates.verifiable]
pass = true
evidence = "three-part oracle vs the pinned reference decoder: equal decoded values (Eq instances), byte-exact re-encoding / identical tx hashes, and identical accept/reject on a mutated-CBOR corpus (corpus not built yet). Re-encode check implemented in the spike"

[gates.scalar_objective]
pass = true
evidence = "Callgrind Ir per pass over a seeded sample of mainnet Conway txs; paired wall time must not regress. Determinism under GHC's RTS: spike run 42294073486"

[gates.bounded]
pass = true
evidence = "decoding 932 txs (622 KB) is sub-second natively (estimate); cold build is the long pole, cached after"

[gates.baseline]
pass = true
evidence = "cardano-ledger @ 7827506 (master, 2026-11-06), Apache-2.0"

[scores.expert_scarcity]
value = 4
evidence = "Haskell performance work (GHC Core, cborg, allocation tuning) is a scarce skill; agents are weaker in Haskell than Rust (estimate)"

[scores.headroom]
value = 3
evidence = "no published decode benchmarks found (searched 2026-11-06); Annotator/MemoBytes keeps original bytes, which suggests slack but is unmeasured. Rust pallas on the same corpus would give a bound"

[scores.eval_cost]
value = 2
evidence = "estimate: full ledger dependency tree incl. plutus-core; cardano-ledger CI needs disk cleanup to build on ubuntu-latest. Spike measures cold + cached"

[scores.noise]
