# decides peaks, laptop, eval_cost and noise. Values marked "estimate" are unmeasured.
[candidate]
slug = "ledger-cbor"
title = "Cardano ledger: faster Conway CBOR decoding (cardano-ledger, Haskell)"
family = "perf"
direction = "minimise"
category = "haskell"
url = "https://github.com/IntersectMBO/cardano-ledger"
